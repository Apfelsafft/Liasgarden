<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lia’s Garten</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌻</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>

  <div id="topbar">
    <div id="starRow"></div>
    <div id="btnGroup">
      <button id="btnHint" class="roundBtn" title="Hilfe">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="26" r="9" fill="#ffe95c" stroke="#e8c02c" stroke-width="2"/>
          <ellipse cx="13" cy="14" rx="7" ry="4.5" fill="#bfe8f7" transform="rotate(-30 13 14)"/>
          <ellipse cx="27" cy="14" rx="7" ry="4.5" fill="#bfe8f7" transform="rotate(30 27 14)"/>
          <circle cx="20" cy="13" r="6" fill="#5b6770"/>
          <circle cx="17.5" cy="12" r="1.4" fill="#fff"/><circle cx="22.5" cy="12" r="1.4" fill="#fff"/>
        </svg>
      </button>
      <button id="btnMusic" class="roundBtn" title="Musik an/aus">
        <svg id="musicIcon" viewBox="0 0 24 24"></svg>
      </button>
      <button id="btnMute" class="roundBtn" title="Ton an/aus">
        <svg id="muteIcon" viewBox="0 0 24 24"></svg>
      </button>
      <button id="btnReset" class="roundBtn" title="Von vorne anfangen">
        <svg viewBox="0 0 24 24">
          <path d="M 19 12 a 7 7 0 1 1 -2.5 -5.4" fill="none" stroke="#e8955e" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M 17 2.5 L 17.2 7.2 L 12.5 6.6 Z" fill="#e8955e"/>
        </svg>
      </button>
    </div>
  </div>

  <button id="navLeft" class="navArrow hidden">
    <svg viewBox="0 0 40 40"><path d="M 26 8 L 12 20 L 26 32" fill="none" stroke="#6aab48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="navRight" class="navArrow hidden">
    <svg viewBox="0 0 40 40"><path d="M 14 8 L 28 20 L 14 32" fill="none" stroke="#6aab48" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div id="dots"></div>

  <div id="helperFly">
    <svg viewBox="-40 -40 80 80">
      <circle class="glow" r="34" fill="#ffe95c" opacity="0.6"/>
      <ellipse class="wing" cx="-9" cy="-14" rx="10" ry="7" fill="#dff3ff" opacity="0.9"/>
      <ellipse class="wing" cx="9" cy="-14" rx="10" ry="7" fill="#dff3ff" opacity="0.9"/>
      <ellipse cx="0" cy="4" rx="10" ry="13" fill="#ffe95c" stroke="#e8c02c" stroke-width="2"/>
      <circle cx="0" cy="-11" r="8.5" fill="#5b6770"/>
      <circle cx="-3" cy="-13" r="2.2" fill="#fff"/><circle cx="3" cy="-13" r="2.2" fill="#fff"/>
      <circle cx="-3" cy="-13" r="1.1" fill="#3a2c20"/><circle cx="3" cy="-13" r="1.1" fill="#3a2c20"/>
      <path d="M -3.5 -7 Q 0 -5 3.5 -7" stroke="#dfe8ef" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="cardOverlay">
    <div id="factCard">
      <div id="factIcon"></div>
      <div id="factText"></div>
      <div id="factStars"></div>
      <div id="cardBtns">
        <button id="btnSpeak" class="cardBtn" title="Vorlesen">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8 Q 19 12 16 16 M 18 5.5 Q 22.5 12 18 18.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button id="btnCardOk" class="cardBtn" title="Weiter">
          <svg viewBox="0 0 24 24"><path d="M 4 13 L 10 19 L 20 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay">
    <div id="confirmCard">
      <div id="confirmIcon">
        <svg viewBox="0 0 24 24">
          <path d="M 19 12 a 7 7 0 1 1 -2.5 -5.4" fill="none" stroke="#e8955e" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M 17 2.5 L 17.2 7.2 L 12.5 6.6 Z" fill="#e8955e"/>
        </svg>
      </div>
      <div id="confirmText">Noch einmal von vorne anfangen?</div>
      <div class="confirmBtns">
        <button id="btnResetYes" class="cardBtn" title="Ja, von vorne" style="background:#8fd45e">
          <svg viewBox="0 0 24 24"><path d="M 4 13 L 10 19 L 20 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnResetNo" class="cardBtn" title="Nein, weiterspielen" style="background:#e88686">
          <svg viewBox="0 0 24 24"><path d="M 6 6 L 18 18 M 18 6 L 6 18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="startOverlay"></div>

  <div id="rotateHint">
    <svg viewBox="0 0 120 120">
      <rect x="35" y="15" width="50" height="90" rx="10" fill="#5a7a3f" stroke="#4a6a33" stroke-width="3"/>
      <rect x="41" y="25" width="38" height="66" rx="4" fill="#bde8ff"/>
      <circle cx="60" cy="99" r="4" fill="#bde8ff"/>
      <g transform="translate(60,58)">
        <path d="M 0 -14 Q -4 26 0 38" stroke="#5f9e45" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(0,-12)"/>
        <g transform="translate(0,-22)">
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(0) translate(0,-13)"/>
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(60) translate(0,-13)"/>
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(120) translate(0,-13)"/>
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(180) translate(0,-13)"/>
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(240) translate(0,-13)"/>
          <ellipse rx="6" ry="12" fill="#ffd23e" transform="rotate(300) translate(0,-13)"/>
          <circle r="9" fill="#96683c"/>
        </g>
      </g>
    </svg>
  </div>

  <script src="audio.js"></script>
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
